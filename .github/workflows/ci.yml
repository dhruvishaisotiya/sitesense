name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Verify no missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        working-directory: backend
        run: python manage.py test --verbosity 2

      - name: Production deployment checks
        working-directory: backend
        env:
          DJANGO_DEBUG: 'False'
          # Must be >= 50 chars with >= 5 unique chars or Django's security.W009
          # check fails. Throwaway value; the real key lives in the host's secrets.
          DJANGO_SECRET_KEY: ci-throwaway-key-for-github-actions-only-do-not-reuse-anywhere
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint src --deny-warnings

      - name: Production build
        working-directory: frontend
        run: npm run build
